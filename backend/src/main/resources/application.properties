spring.application.name=finanzero-api
server.port=8080

# PostgreSQL local. Crie antes o banco "finanzero" no pgAdmin.
# Informe a senha do usuario postgres por variavel de ambiente para nao deixar senha no codigo.
spring.datasource.url=jdbc:postgresql://localhost:5432/finanzero
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 foi substituido por PostgreSQL nesta versao.
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origin=http://localhost:5173

# E-mail com EmailJS.
# Por padrão fica simulado para facilitar testes locais. Para envio real:
# 1) crie uma conta no EmailJS;
# 2) crie um Email Service;
# 3) crie um Email Template usando as variáveis indicadas no README;
# 4) informe SERVICE_ID, TEMPLATE_ID e PUBLIC_KEY por variáveis de ambiente;
# 5) mude app.mail.enabled=true.
app.mail.enabled=true
app.mail.from-name=FinanZero
app.mail.reply-to=noreply@finanzero.local
app.mail.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.mail.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.mail.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.mail.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
app.mail.emailjs.base-url=https://api.emailjs.com/api/v1.0/email/send

# URL pública usada nos links de comprovantes enviados por e-mail.
# Localmente, os links abrem apenas no seu computador. Em produção, troque pelo domínio público do backend.
app.public-base-url=http://localhost:8080

# Comprovantes no Amazon S3.
# O bucket deve ser privado. A rota /api/receipts/{arquivo} gera um link temporário para abrir o arquivo.
app.aws.s3.bucket=${AWS_S3_BUCKET:}
app.aws.s3.region=${AWS_REGION:sa-east-1}
app.aws.s3.receipts-prefix=receipts/
# 10080 minutos = 7 dias. O arquivo expira no S3 pela Lifecycle Rule do bucket após 30 dias.
app.aws.s3.presigned-url-minutes=10080

app.upload.max-receipt-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
