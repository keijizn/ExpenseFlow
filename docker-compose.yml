services:
  postgres:
    image: postgres:16
    container_name: finanzero-postgres
    environment:
      POSTGRES_DB: finanzero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finanzero_pg:/var/lib/postgresql/data
volumes:
  finanzero_pg:
